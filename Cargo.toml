[package]
name = "ducky"
version = "0.1.0"
edition = "2024"
description = "Ducky — a native programming-practice workspace manager"
license = "MIT"

[dependencies]
directories = "6.0.0"
dark-light = "3.0.0"
fluent-bundle = "0.16.0"
open = "5.3.2"
rfd = "0.18.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
slint = { version = "1.19.1", default-features = false, features = ["backend-winit", "renderer-femtovg", "renderer-software", "std", "compat-1-18"] }
sys-locale = "0.3.2"
unic-langid = { version = "0.9.6", features = ["macros"] }

[build-dependencies]
slint-build = "1.19.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
